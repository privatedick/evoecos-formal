name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lean-build:
    name: Lean build (0 sorry / 0 repo-declared axiom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `lake build` also runs the `AxiomAudit` default target, which is the
      # real sorry/axiom gate: it walks every declaration this repository's
      # modules contribute to the environment and fails if any depends on an
      # axiom outside Lean's standard three. That catches `sorryAx` in any
      # syntactic position (`exact sorry`, `:= sorry`, `<;> sorry`), which a
      # line-anchored grep would miss.
      - uses: leanprover/lean-action@v1
      # On failure, surface Lean's error lines and the failed-target list as
      # annotations, so the cause is on the run's summary page rather than
      # only inside the raw log. Failed jobs aren't cached, so this re-runs
      # just the failing modules.
      - name: Annotate build errors
        if: failure()
        run: |
          lake build 2>&1 | grep -E '^(error|✖)|: error|^- ' \
            | head -60 | sed 's/^/::error title=lake build::/' || true
      # Independent of the axiom footprint: replay the built environment
      # through the kernel, catching anything that got into the environment
      # without passing it (unsafe/metaprogramming routes, corrupt oleans).
      # `AxiomAudit` imports every library in this repo (Architecture,
      # EvoEcos, InfoTheory, Kernel, ProvablyCorrectControllers, Thresholds),
      # so checking it alone covers the whole corpus.
      #
      # leanchecker is NOT a sorry check — it exits 0 on `sorryAx`, since that
      # is a legitimate axiom to the kernel. AxiomAudit above is what makes
      # the 0-sorry claim; this checks a different property.
      - name: Replay environment through the kernel (leanchecker)
        run: lake env leanchecker AxiomAudit
      # Surface the environment-derived theorem count (logged by AxiomAudit)
      # as a run annotation, so the README's headline number is visible on
      # every build instead of only inside the raw log. Fails if the line is
      # missing, which would mean the count itself stopped being produced.
      - name: Report declaration count
        run: |
          lake env lean AxiomAudit.lean 2>&1 | grep -o 'declaration count: .*' \
            | sed 's/^/::notice title=Theorem count::/'
